name: Add mission export

on:
  push:
    paths:
      - .github/workflows/add-mission-export.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mission UI and export
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<title>井の頭線すごろく v2.1</title>','<title>井の頭線すごろく v2.2</title>',1)
          old='<div class="row"><button class="btn purple" id="missionBtn">ミッション抽選</button><button class="btn green" id="confirmMission" disabled>この内容で確定</button></div><div class="mini" id="missionHistory"></div>'
          new='<div class="row"><button class="btn purple" id="missionBtn">ミッション抽選</button><button class="btn green" id="confirmMission" disabled>この内容で確定</button><button class="btn ghost" id="missionExportBtn">📄 ミッション出力</button></div><div class="mini" id="missionConfirmNotice" style="margin-top:8px;color:#ffd54a;font-weight:900;display:none">⚠️ 抽選しただけでは確定されません。「この内容で確定」を押してください。</div><div class="mini" id="missionHistory"></div>'
          if old not in s: raise SystemExit('mission controls target not found')
          s=s.replace(old,new,1)
          old2="document.getElementById('missionResult').textContent=state.pendingMission||'抽選待ち';document.getElementById('confirmMission').disabled=!state.pendingMission;document.getElementById('missionHistory').textContent=`確定ミッション: ${state.missions.length}件`;"
          new2="document.getElementById('missionResult').textContent=state.pendingMission||'抽選待ち';document.getElementById('confirmMission').disabled=!state.pendingMission;const notice=document.getElementById('missionConfirmNotice');notice.style.display=state.pendingMission?'block':'none';document.getElementById('missionHistory').textContent=`確定ミッション: ${state.missions.length}件`;"
          if old2 not in s: raise SystemExit('draw mission target not found')
          s=s.replace(old2,new2,1)
          anchor="function exportBookmark(){const w=window.open('','_blank');if(!w){alert('ポップアップがブロックされました');return}"
          if anchor not in s: raise SystemExit('exportBookmark anchor not found')
          insert="function exportMissions(){if(!state.missions.length){alert('確定済みのミッションがありません。');return}const w=window.open('','_blank');if(!w){alert('ポップアップがブロックされました');return}w.document.write(`<!doctype html><html lang=\"ja\"><head><meta charset=\"utf-8\"><title>確定ミッション一覧</title><style>body{font-family:system-ui,-apple-system,\"Noto Sans JP\",sans-serif;max-width:760px;margin:40px auto;padding:0 24px;color:#111827}h1{border-bottom:3px solid #6d4fc4;padding-bottom:10px}.missionRow{padding:12px 0;border-bottom:1px solid #dbe2ea}.station{font-weight:900}.text{margin-top:4px;padding:8px 12px;background:#f5f3ff;border-radius:8px}@media print{button{display:none}}</style></head><body><h1>確定ミッション一覧</h1>${state.missions.map((m,i)=>`<div class=\"missionRow\"><div class=\"station\">${i+1}. ${escapeHtml(m.station||'駅未設定')}</div><div class=\"text\">${escapeHtml(m.text)}</div></div>`).join('')}<p><button onclick=\"window.print()\">印刷 / PDF保存</button></p></body></html>`);w.document.close()}\n"
          s=s.replace(anchor,insert+anchor,1)
          old3="document.getElementById('confirmMission').onclick=confirmMission;document.getElementById('missionAddBtn').onclick="
          new3="document.getElementById('confirmMission').onclick=confirmMission;document.getElementById('missionExportBtn').onclick=exportMissions;document.getElementById('missionAddBtn').onclick="
          if old3 not in s: raise SystemExit('event target not found')
          s=s.replace(old3,new3,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add mission export and confirm notice"
          git push
