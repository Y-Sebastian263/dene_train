name: Restrict service draw by current station v27

on:
  push:
    paths:
      - .github/workflows/restrict-service-draw-by-station-v27.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch service draw logic
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<title>井の頭線すごろく v2.6</title>','<title>井の頭線すごろく v2.7</title>',1)

          old="async function runTurn(){if(turnBusy||state.complete)return;pushUndo();turnBusy=true;draw();try{const serviceNo=randomInt(2),service=serviceNo===1?'local':'express';await animateDecision('種別',['各駅停車','急行'],serviceNames[service],`/dice 2 → ${serviceNo}`);state.service=service;addLog(`種別抽選：/dice 2 → ${serviceNo}（${serviceNames[service]}）`);const roll=randomInt(6);"
          new="async function runTurn(){if(turnBusy||state.complete)return;pushUndo();turnBusy=true;draw();try{const canExpress=!!stations[state.current].express;let serviceNo,service;if(canExpress){serviceNo=randomInt(2);service=serviceNo===1?'local':'express';await animateDecision('種別',['各駅停車','急行'],serviceNames[service],`/dice 2 → ${serviceNo}`);addLog(`種別抽選：/dice 2 → ${serviceNo}（${serviceNames[service]}）`)}else{serviceNo=1;service='local';await animateDecision('種別',['各駅停車'],serviceNames[service],`${stations[state.current].name}は各停駅のため各駅停車のみ`);addLog(`種別決定：${stations[state.current].name}は急行非停車のため各駅停車`)}state.service=service;const roll=randomInt(6);"
          if old not in s:
              raise SystemExit('runTurn target not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restrict express draw to express-stop stations"
          git push